  player-not-found: "{prefix}&cPlayer &e{player} &cis not online."
  self: "{prefix}&7Kills: &a{kills} &7| Deaths: &c{deaths} &7| KDR: &e{kdr} &7| Streak: &6{streak} &7| Rank: &b{rank}"
  other: "{prefix}&e{player}&7 — Kills: &a{kills} &7| Deaths: &c{deaths} &7| KDR: &e{kdr} &7| Streak: &6{streak} &7| Rank: &b{rank}"

economy:
  kill-reward: "{prefix}&a+&2${amount} &7por eliminar a &e{victim}&7."
  death-penalty: "{prefix}&c-${amount} &7for dying to &e{killer}&7."
