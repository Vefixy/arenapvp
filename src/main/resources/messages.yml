action-bar:
  stats: "&7Kills: &a{kills} &7| Deaths: &c{deaths} &7| KDR: &e{kdr} &7| Streak: &6{streak} &7| Rank: &b{rank}"
  kill-reward: "&a+&2${amount} &7por eliminar a &e{victim}"
  combined: "{reward} &8| {stats}"

pvp:
  kill-broadcast: "{prefix}&e{killer} &7eliminated &c{victim} &7[&6{streak} streak&7]"
  rank-up: "{prefix}&aYou ranked up to &b{rank}&a!"

updates:
  checking: "{prefix}&7Checking for updates..."
  up-to-date: "{prefix}&aYou are running the latest version (&ev{version}&a)."
  available: "{prefix}&eA new version is available: &a{latest} &7(current: &c{current}&7). Download: &b{url}"
  failed: "{prefix}&cCould not check for updates. See console for details."
  console-up-to-date: "[ArenaPVP] Running latest version v{version}."
  console-available: "[ArenaPVP] Update available: v{latest} (current v{current}) — {url}"

help:
  - "{prefix}&c&lArenaPVP Commands"
  - "&e/arenapvp warp [arena] &7- GUI or warp to arena"
  - "&e/arenapvp setarena <name> &7- Set arena location (admin)"
  - "&e/arenapvp kit [name] &7- GUI or receive kit directly"
  - "&e/arenapvp stats [player] &7- View PVP stats"
  - "&e/arenapvp reload &7- Reload config (admin)"
  - "&e/arenapvp update &7- Check for updates (admin)"
  - "&e/arenapvp kit create <name> &7- Save local kit (admin)"
  - "&e/arenapvp kit delete <name> &7- Delete local kit (admin)"
