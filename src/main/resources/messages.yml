  kit-not-found: "{prefix}&cKit &e{kit} &cnot found."
  kit-created: "{prefix}&aLocal kit &e{kit} &acreated from your inventory."
  kit-deleted: "{prefix}&aLocal kit &e{kit} &adeleted."
  essentials-unavailable: "{prefix}&cEssentials is not installed. Using local kits only."

